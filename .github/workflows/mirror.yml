name: Mirror herdr releases

# Polls releases.herdr.dev for new herdr-core and herdr app builds and mirrors
# the archives as GitHub release assets. Upstream serves these from its own
# host, not from GitHub releases, so this keeps a versioned, checksummed copy here.

on:
  schedule:
    # Every 6 hours, offset from the upstream release jobs
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      component:
        description: "Which component to mirror"
        default: "all"
        type: choice
        options:
          - all
          - core
          - app
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror.yml"
      - "scripts/mirror.sh"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      group: mirror-${{ matrix.component }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        component: [core, app]
    steps:
      - uses: actions/checkout@v4

      - name: Mirror ${{ matrix.component }} from releases.herdr.dev
        # On manual runs, mirror only the chosen component ("all" runs both)
        if: >-
          github.event_name != 'workflow_dispatch'
          || inputs.component == 'all'
          || inputs.component == matrix.component
        run: bash scripts/mirror.sh "${{ matrix.component }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
